<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- Analog zur Desktop-Härtung (Electron): explizite CSP für die WebView.
         Ohne 'unsafe-inline'/'unsafe-eval', da auch hier nur element.style.property
         verwendet wird statt <style>-Tags/style="..."-Attributen. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none';">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Abo-Warner Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<!-- Alle sichtbaren Texte kommen aus src/i18n/<sprache>.js (Attribute
     data-i18n, data-i18n-html, data-i18n-placeholder, data-i18n-aria-label;
     befüllt beim Start durch wendeAufDokumentAn() in i18n.js). -->
<body>
    <header class="site-header">
        <div class="header-inner">
            <div class="brand">
                <div class="brand-icon">
                    <img src="app-icon.png" alt="Abo-Warner Pro">
                </div>
                <span class="brand-name">Abo-Warner Pro</span>
            </div>
            <div class="kopf-aktionen">
                <button type="button" id="btn-sprache" class="hilfe-btn" data-i18n-aria-label="kopf.sprache">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
                </button>
                <button type="button" id="btn-hilfe" class="hilfe-btn" data-i18n-aria-label="kopf.hilfe">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="hero-bg" aria-hidden="true"></div>
        <div class="page-container">
            <div class="intro">
                <h1 class="page-title" data-i18n="start.titel"></h1>
                <p class="page-subline" data-i18n="start.subline"></p>
                <p class="page-subtitle" data-i18n="start.untertitel"></p>
            </div>

            <section class="content-panel">
                <div class="content-toolbar">
                    <div class="search-wrap">
                        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
                        <input type="text" id="input-suche" class="search-input" data-i18n-placeholder="suche.platzhalter">
                    </div>
                    <button type="button" id="btn-neues-abo" class="btn btn-primary btn-sm">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                        <span data-i18n="knopf.neuesAbo"></span>
                    </button>
                </div>

                <div id="filter-chips" class="filter-chips"></div>

                <div id="stats-grid" class="stats-grid"></div>

                <ul id="abo-liste" class="abo-list"></ul>
            </section>

            <section class="glass daten-panel" aria-labelledby="daten-titel">
                <h2 class="daten-titel" id="daten-titel" data-i18n="daten.titel"></h2>
                <p class="daten-text" data-i18n="daten.text"></p>
                <div class="daten-aktionen">
                    <button type="button" id="btn-sicherung-erstellen" class="btn btn-outline btn-sm">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>
                        <span data-i18n="daten.erstellen"></span>
                    </button>
                    <button type="button" id="btn-sicherung-wiederherstellen" class="btn btn-outline btn-sm">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/></svg>
                        <span data-i18n="daten.wiederherstellen"></span>
                    </button>
                    <input type="file" id="input-sicherung-datei" accept=".json,application/json" hidden>
                </div>
                <div class="daten-pdf">
                    <button type="button" id="btn-uebersicht-pdf" class="btn btn-outline btn-sm">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 13H8"/><path d="M16 17H8"/><path d="M16 13h-2"/></svg>
                        <span data-i18n="daten.pdf"></span>
                    </button>
                    <p class="daten-text" data-i18n="daten.pdfText"></p>
                </div>
                <p id="daten-status" class="daten-status" aria-live="polite"></p>
            </section>

            <div id="abo-modal-overlay" class="modal-overlay" hidden>
                <div class="glass-strong modal-dialog">
                    <div class="modal-header">
                        <h2 class="modal-title" data-i18n="neu.titel"></h2>
                        <button type="button" id="btn-modal-schliessen" class="modal-close-btn" data-i18n-aria-label="knopf.schliessen">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                        </button>
                    </div>
                    <form id="abo-form">
                        <!-- Per Foto einlesen (ab 2.0.2): Texterkennung nur auf dem Gerät,
                             Kamera/Bildauswahl öffnen sich nur über diese Knöpfe. -->
                        <div id="foto-bereich" class="foto-bereich">
                            <button type="button" id="btn-foto-einlesen" class="btn btn-outline btn-sm foto-knopf" aria-controls="foto-auswahl">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
                                <span data-i18n="foto.knopf"></span>
                            </button>
                            <div id="foto-auswahl" class="foto-auswahl" hidden>
                                <p class="foto-hinweis" data-i18n="foto.hinweis"></p>
                                <div class="foto-auswahl-knoepfe">
                                    <button type="button" id="btn-foto-aufnehmen" class="btn btn-outline btn-sm" data-i18n="foto.aufnehmen"></button>
                                    <button type="button" id="btn-foto-auswaehlen" class="btn btn-outline btn-sm" data-i18n="foto.auswaehlen"></button>
                                </div>
                            </div>
                            <input type="file" id="input-foto-kamera" accept="image/*" capture="environment" hidden>
                            <input type="file" id="input-foto-datei" accept="image/*" hidden>
                            <p id="foto-status" class="foto-status" role="status" aria-live="polite" hidden></p>
                        </div>
                        <div class="form-group">
                            <label for="input-name" data-i18n="feld.name"></label>
                            <input type="text" id="input-name" class="input-control" data-i18n-placeholder="feld.namePlatzhalter">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="input-kosten" data-i18n="feld.kosten"></label>
                                <input type="text" inputmode="decimal" id="input-kosten" class="input-control" data-i18n-placeholder="feld.kostenPlatzhalter">
                            </div>
                            <div class="form-group">
                                <label for="input-waehrung" data-i18n="feld.waehrung"></label>
                                <input type="text" id="input-waehrung" class="input-control" data-i18n-placeholder="feld.waehrungPlatzhalter" autocomplete="off">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="input-turnus" data-i18n="feld.turnus"></label>
                                <!-- value = gespeicherter (deutscher) Wert, Anzeige übersetzt -->
                                <select id="input-turnus" class="input-control select-control">
                                    <option value="Monatlich" data-i18n="turnus.Monatlich"></option>
                                    <option value="Vierteljährlich" data-i18n="turnus.Vierteljährlich"></option>
                                    <option value="Halbjährlich" data-i18n="turnus.Halbjährlich"></option>
                                    <option value="Jährlich" data-i18n="turnus.Jährlich"></option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="input-kategorie" data-i18n="feld.kategorie"></label>
                                <select id="input-kategorie" class="input-control select-control">
                                    <option value="Streaming" data-i18n="kategorie.Streaming"></option>
                                    <option value="Sport" data-i18n="kategorie.Sport"></option>
                                    <option value="Versicherung" data-i18n="kategorie.Versicherung"></option>
                                    <option value="Sonstiges" data-i18n="kategorie.Sonstiges"></option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group date-field">
                                <label for="input-datum" data-i18n="feld.naechsteZahlung"></label>
                                <div class="date-input-wrap">
                                    <input type="text" id="input-datum" class="input-control date-input" data-i18n-placeholder="feld.datumPlatzhalter" readonly autocomplete="off">
                                    <svg class="date-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
                                    <div id="date-picker-popover" class="date-picker-popover" hidden></div>
                                </div>
                                <input type="hidden" id="input-datum-iso">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="input-frist" data-i18n="feld.frist"></label>
                                <div class="frist-eingabe">
                                    <input type="number" id="input-frist" class="input-control frist-anzahl" min="0" step="1" inputmode="numeric">
                                    <!-- value = gespeicherte Einheit, Anzeige übersetzt -->
                                    <select id="input-frist-einheit" class="input-control select-control frist-einheit" data-i18n-aria-label="feld.fristEinheit">
                                        <option value="tage" data-i18n="einheit.tage"></option>
                                        <option value="wochen" data-i18n="einheit.wochen"></option>
                                        <option value="monate" data-i18n="einheit.monate"></option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <!-- Probeabo / Testzeitraum (ab 2.0.2): bewusst nicht zugeklappt -->
                        <div class="probe-bereich">
                            <label class="schalter">
                                <input type="checkbox" id="input-probe" class="schalter-input">
                                <span class="schalter-regler" aria-hidden="true"></span>
                                <span class="schalter-text" data-i18n="feld.probe"></span>
                            </label>
                            <div id="probe-datum-gruppe" class="form-group date-field" hidden>
                                <label for="input-probe-datum" data-i18n="feld.probeEnde"></label>
                                <div class="date-input-wrap">
                                    <input type="text" id="input-probe-datum" class="input-control date-input" data-i18n-placeholder="feld.datumPlatzhalter" readonly autocomplete="off">
                                    <svg class="date-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
                                    <div id="probe-date-picker-popover" class="date-picker-popover" hidden></div>
                                </div>
                                <input type="hidden" id="input-probe-datum-iso">
                            </div>
                        </div>
                        <details id="weitere-angaben" class="weitere-angaben">
                            <summary class="weitere-angaben-summary" data-i18n="neu.weitere"></summary>
                            <div class="weitere-angaben-felder">
                                <p class="weitere-angaben-hinweis" data-i18n="neu.weitereHinweis"></p>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="input-vertragsnummer" data-i18n="feld.vertragsnummer"></label>
                                        <input type="text" id="input-vertragsnummer" class="input-control" autocomplete="off">
                                    </div>
                                    <div class="form-group">
                                        <label for="input-kundennummer" data-i18n="feld.kundennummer"></label>
                                        <input type="text" id="input-kundennummer" class="input-control" autocomplete="off">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="input-vertragspartner" data-i18n="feld.vertragspartner"></label>
                                    <textarea id="input-vertragspartner" class="input-control textarea-control" rows="4" data-i18n-placeholder="feld.vertragspartnerPlatzhalter"></textarea>
                                </div>
                            </div>
                        </details>
                        <button type="button" id="btn-speichern" class="btn btn-primary btn-lg btn-block">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                            <span data-i18n="neu.speichern"></span>
                        </button>
                        <p id="form-fehler" class="form-fehler" aria-live="polite"></p>
                    </form>
                </div>
            </div>
        </div>

        <!-- Fußzeile scrollt mit (ab 2.0.2), damit auf dem Handy mehr Platz für die Abos bleibt. -->
        <footer class="site-footer">
            <div class="footer-inner">
                <div class="footer-brand">
                    <div class="footer-brand-icon">
                        <img src="app-icon.png" alt="Abo-Warner Pro">
                    </div>
                    <span class="footer-brand-name">Abo-Warner Pro</span>
                    <span class="footer-copyright">© 2026 AppVektor</span>
                </div>
                <div class="footer-links">
                    <button type="button" id="btn-footer-datenschutz" class="footer-link-btn" data-i18n="fuss.datenschutz"></button>
                    <button type="button" id="btn-footer-impressum" class="footer-link-btn" data-i18n="fuss.impressum"></button>
                    <button type="button" id="btn-footer-kontakt" class="footer-link-btn" data-i18n="fuss.kontakt"></button>
                </div>
            </div>
            <!-- Dezenter Hinweis auf den Anbieter. Externe Links öffnet Capacitor
                 automatisch im normalen Browser des Geräts (nicht in der App);
                 die App selbst lädt dabei nichts und überträgt keine Daten. -->
            <div class="footer-von">
                <span class="footer-von-titel" data-i18n="fuss.von"></span>
                <a href="https://appvektor.com" target="_blank" rel="noopener noreferrer">appvektor.com</a>
            </div>
        </footer>
    </main>

    <div id="rechtliches-modal-overlay" class="modal-overlay" hidden>
        <div class="glass-strong modal-dialog rechtliches-dialog">
            <div class="modal-header">
                <h2 class="modal-title" id="rechtliches-titel"></h2>
                <button type="button" id="btn-rechtliches-schliessen" class="modal-close-btn" data-i18n-aria-label="knopf.schliessen">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>

            <div id="rechtliches-datenschutz" class="rechtliches-inhalt" data-i18n-html="datenschutz.inhalt"></div>

            <div id="rechtliches-impressum" class="rechtliches-inhalt" data-i18n-html="impressum.inhalt" hidden></div>

            <div id="rechtliches-kontakt" class="rechtliches-inhalt" hidden>
                <h3 data-i18n="kontakt.ueberschrift"></h3>
                <p data-i18n="kontakt.schreib"></p>
                <p class="kontakt-zeile">
                    <a href="mailto:kontakt@appvektor.com" class="kontakt-mail">kontakt@appvektor.com</a>
                    <button type="button" id="btn-kontakt-kopieren" class="kontakt-kopieren-btn" data-i18n="kontakt.kopieren"></button>
                </p>
                <p id="kontakt-hinweis" class="kontakt-hinweis" role="status" hidden></p>
                <p data-i18n="kontakt.keinMailProgramm"></p>
                <p data-i18n="kontakt.telefon"></p>
            </div>
        </div>
    </div>

    <div id="hilfe-modal-overlay" class="modal-overlay" hidden>
        <div class="glass-strong modal-dialog rechtliches-dialog" role="dialog" aria-modal="true" aria-labelledby="hilfe-titel">
            <div class="modal-header">
                <h2 class="modal-title" id="hilfe-titel" data-i18n="hilfe.titel"></h2>
                <button type="button" id="btn-hilfe-schliessen" class="modal-close-btn" data-i18n-aria-label="knopf.schliessen">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>

            <div class="rechtliches-inhalt hilfe-inhalt" data-i18n-html="hilfe.inhalt"></div>
        </div>
    </div>

    <div id="sprache-modal-overlay" class="modal-overlay sprache-overlay" hidden>
        <div class="glass-strong modal-dialog sprache-dialog" role="dialog" aria-modal="true" aria-labelledby="sprache-titel">
            <div class="modal-header">
                <h2 class="modal-title" id="sprache-titel" data-i18n="sprache.titel"></h2>
                <button type="button" id="btn-sprache-schliessen" class="modal-close-btn" data-i18n-aria-label="knopf.schliessen">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
            <!-- Sprachnamen stehen bewusst immer in ihrer eigenen Sprache. -->
            <div class="sprache-optionen" role="radiogroup" aria-labelledby="sprache-titel">
                <label class="sprache-option"><input type="radio" name="sprache" value="auto"><span data-i18n="sprache.auto"></span></label>
                <label class="sprache-option"><input type="radio" name="sprache" value="de"><span lang="de">Deutsch</span></label>
                <label class="sprache-option"><input type="radio" name="sprache" value="en"><span lang="en">English</span></label>
                <label class="sprache-option"><input type="radio" name="sprache" value="es"><span lang="es">Español</span></label>
                <label class="sprache-option"><input type="radio" name="sprache" value="fr"><span lang="fr">Français</span></label>
                <label class="sprache-option"><input type="radio" name="sprache" value="pt"><span lang="pt">Português</span></label>
            </div>
            <div class="modal-aktionen sprache-aktionen">
                <button type="button" id="btn-sprache-abbrechen" class="btn btn-outline btn-sm" data-i18n="knopf.abbrechen"></button>
                <button type="button" id="btn-sprache-uebernehmen" class="btn btn-primary btn-sm" data-i18n="sprache.uebernehmen"></button>
            </div>
        </div>
    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
