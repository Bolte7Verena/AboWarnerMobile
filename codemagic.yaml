workflows:
  ios-app-store:
    name: iOS – Build, Sign & TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Name muss exakt mit der App-Store-Connect-Integration übereinstimmen,
      # die im Codemagic-Dashboard unter Teams > Integrations angelegt wird.
      app_store_connect: appstore_credentials
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.abowarner.pro
      vars:
        # Numerische App-Store-Connect-App-ID (NICHT die Bundle-ID) —
        # erst bekannt, nachdem die App in App Store Connect angelegt wurde.
        # Bis dahin bricht der "Increment build number"-Schritt unten ab.
        APP_STORE_APPLE_ID: 0000000000
      node: latest
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Web-Assets bauen (src/ -> www/)
        script: npm run build

      - name: Capacitor iOS-Projekt synchronisieren (inkl. pod install)
        script: npx cap sync ios

      - name: Code-Signing einrichten (automatisch via App Store Connect API)
        script: xcode-project use-profiles

      - name: Build-Nummer hochzählen
        script: |
          cd ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))

      - name: IPA bauen
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - bolte7verena@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # Absichtlich konservativ: landet in TestFlight, geht NICHT automatisch
        # in die Apple-Review. Erst nach eigenem Test in TestFlight auf
        # submit_to_app_store: true umstellen (oder manuell in App Store
        # Connect einreichen).
        submit_to_testflight: true
        submit_to_app_store: false

  ios-screenshots:
    name: iOS – App-Store-Screenshots (Fastlane Snapshot)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # Reiner Simulator-Lauf — braucht kein Code-Signing/Provisioning,
      # anders als der ios-app-store-Workflow oben.
      vars:
        # Verhindert, dass Fastlanes Selbst-Update-Check beim Start jedes
        # Befehls läuft (mögliche Ursache für den Bundler/Thor-Absturz
        # weiter unten — sicherheitshalber deaktiviert, in CI-Umgebungen
        # ohnehin Standardempfehlung von Fastlane).
        FASTLANE_SKIP_UPDATE_CHECK: "1"
      node: latest
      xcode: latest
    cache:
      cache_paths:
        - $HOME/.npm
        - vendor/bundle
    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Web-Assets bauen (src/ -> www/)
        script: npm run build

      - name: Capacitor iOS-Projekt synchronisieren
        script: npx cap sync ios

      - name: Fastlane installieren
        script: |
          bundle config set --local path 'vendor/bundle'
          bundle install

      - name: SnapshotHelper.swift auf installierte Fastlane-Version bringen
        # Bewusst NICHT "fastlane snapshot update" — dieser Unterbefehl stürzte
        # in einem echten Build mit einem Bundler/Thor-internen Fehler ab
        # (Bundler::CLI.dispatch), bevor Fastlane überhaupt lief. Stattdessen
        # wird die Original-Vorlage direkt aus dem gerade von Bundler
        # installierten fastlane-Gem kopiert — macht dasselbe, ohne über
        # Bundlers Kommandozeilen-Dispatch zu laufen.
        script: |
          HELPER=$(find vendor/bundle -path '*/snapshot/lib/assets/SnapshotHelper.swift' | head -n1)
          if [ -z "$HELPER" ]; then
            echo "SnapshotHelper.swift-Vorlage nicht im installierten fastlane-Gem gefunden" >&2
            exit 1
          fi
          echo "Kopiere aus: $HELPER"
          cp "$HELPER" ios/App/AboWarnerProUITests/SnapshotHelper.swift

      - name: Screenshots mit Fastlane Snapshot erzeugen (iPhone 6.9" + iPad 13")
        script: |
          set +e
          bundle exec fastlane screenshots
          FASTLANE_EXIT=$?
          echo "--- fastlane screenshots Exit-Code: $FASTLANE_EXIT ---"
          echo "--- Inhalt von fastlane/screenshots (zur Diagnose, falls leer) ---"
          find fastlane/screenshots -type f 2>/dev/null | sort
          echo "--- Anzahl PNG-Dateien: $(find fastlane/screenshots -name '*.png' 2>/dev/null | wc -l) ---"
          exit $FASTLANE_EXIT

    artifacts:
      # Mehrere, sich überschneidende Muster — falls eines davon mit dem
      # tatsächlich genutzten Glob-Verhalten von Codemagic keine
      # verschachtelten Dateien erfasst, greift ein anderes.
      - fastlane/screenshots/**
      - fastlane/screenshots/**/*.png
      - fastlane/screenshots/*/*.png

    publishing:
      email:
        recipients:
          - bolte7verena@gmail.com
        notify:
          success: true
          failure: true
